name: virtufit
description: "VirtuFit — Plateforme d'essayage virtuel 3D"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State Management 
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation 
  go_router: ^14.2.0

  # Network
  dio: ^5.7.0
  retrofit: ^4.1.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # Utilities
  intl: ^0.20.2
  logger: ^2.4.0
  get_it: ^8.0.2

  cupertino_icons: ^1.0.8

  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  retrofit_generator: ^9.1.2
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true